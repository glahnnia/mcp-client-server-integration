[project]
name = "mcp-document-workflow-demo"
version = "0.1.0"
description = "Portfolio demonstration of MCP client/server tools, resources, and prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.8,<2",
  "anthropic>=0.51,<2",
  "python-dotenv>=1.1,<2",
  "prompt-toolkit>=3.0.51,<4",
]


[tool.setuptools]
packages = ["core"]
py-modules = ["mcp_server", "mcp_client", "demo_workflow", "main"]
